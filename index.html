<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCAR-F Question Bank</title>
<meta name="description" content="Exam prep for the Claude Certified Architect (Foundations) certification — mock exams, drills, and mastery tracking.">
<link rel="manifest" href="/manifest.webmanifest">
<!-- Icons: the SVG for browsers that take it, favicon.ico for the
     rest, and a full-bleed PNG for iOS home screens. -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="CCAR-F Prep">
<meta name="theme-color" content="#f6f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191c" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<!-- The chosen light/dark theme applies before anything paints, so the page
     never flashes in the other theme. Same key as before: "ccarf.theme". -->
<script>
  (function () {
    var t = "auto";
    try { t = JSON.parse(localStorage.getItem("ccarf.theme")) || "auto"; } catch (e) {}
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-mantine-color-scheme", t);
    /* The browser bar follows the chosen theme, not just the device's. */
    var bar = t === "dark" ? "#17191c" : "#f6f7f4";
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", bar);
  })();
</script>
<!-- The loading screen: plain HTML and CSS, shown while the question bank
     (about 1 MB) and the app download. React replaces it on first render. -->
<style>
  html, body { margin: 0; background: #f6f7f4; }
  [data-mantine-color-scheme="dark"], [data-mantine-color-scheme="dark"] body { background: #17191c; }
  .boot { min-height: 100vh; min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 18px;
    font: 15px/1.4 "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif; color: #5a6168; }
  [data-mantine-color-scheme="dark"] .boot { color: #a3a9b0; }
  .boot svg { animation: boot-pulse 1.4s ease-in-out infinite; }
  .boot-bar { width: 140px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(31, 79, 216, 0.15); }
  .boot-bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: #1f4fd8;
    animation: boot-slide 1.1s ease-in-out infinite; }
  @keyframes boot-pulse { 50% { transform: scale(0.94); } }
  @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .boot svg, .boot-bar::after { animation: none; } }
</style>
</head>
<body>
<div id="root"><div class="boot" role="status">
  <svg width="56" height="56" viewBox="0 0 128 128" aria-hidden="true">
    <rect width="128" height="128" rx="28" fill="#1f4fd8"/>
    <circle cx="64" cy="64" r="34" fill="none" stroke="#f6f7f4" stroke-width="7"/>
    <circle cx="64" cy="64" r="19" fill="#f6f7f4"/>
  </svg>
  <div class="boot-bar" aria-hidden="true"></div>
  <div>Loading questions…</div>
</div></div>
<!-- Screen-reader announcements (src/core/announce.js): outside the React
     tree, so a redraw never resets it. -->
<div id="sr-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<noscript>This app needs JavaScript.</noscript>
<!-- Data and pure logic stay classic scripts, loaded before the app. The 300
     questions without an exam-guide objective are in questions/unmapped/
     and are fetched only for old attempts or sessions that used them. -->
<script src="questions/extra-set.js"></script>
<script src="questions/domain1-gap.js"></script>
<script src="questions/domain2-gap.js"></script>
<script src="questions/domain3-gap.js"></script>
<script src="questions/domain4-gap.js"></script>
<script src="questions/domain5-gap.js"></script>
<script src="questions/domain1-multi.js"></script>
<script src="questions/domain2-multi.js"></script>
<script src="questions/domain3-multi.js"></script>
<script src="questions/domain4-multi.js"></script>
<script src="questions/domain5-multi.js"></script>
<script src="exams/index.js"></script>
<script src="scenarios/index.js"></script>
<script src="scenarios/support.js"></script>
<script src="scenarios/extraction.js"></script>
<script src="scenarios/ci.js"></script>
<script src="scenarios/research.js"></script>
<script src="scenarios/codegen.js"></script>
<script src="scenarios/devprod.js"></script>
<script src="config.js"></script>
<script src="resources.js"></script>
<script src="js/logic.js"></script>
<script src="js/store.js"></script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
