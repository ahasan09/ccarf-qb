<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAR-F Question Bank</title>
<meta name="description" content="Exam prep for the Claude Certified Architect (Foundations) certification — mock exams, drills, and mastery tracking.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f6f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191c" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f7f4;
    --card: #ffffff;
    --ink: #22262a;
    --graphite: #5a6168;
    --line: #e3e5e0;
    --line-strong: #c9ccc5;
    --pen: #1f4fd8;
    --pen-soft: #e9eefb;
    --pass: #178a50;
    --pass-soft: #e3f2ea;
    --fail: #c8402e;
    --fail-soft: #faeae7;
    --flag: #b07d10;
    --flag-soft: #f9f0da;
    --d1: #6b4fa0; --d2: #0f7a8a; --d3: #b4532a; --d4: #178a50; --d5: #8c5a1f;
    --shadow: 0 1px 2px rgba(34,38,42,0.05), 0 4px 16px rgba(34,38,42,0.06);
    --radius: 14px;
    --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #17191c;
      --card: #1f2227;
      --ink: #e9ebed;
      --graphite: #9aa2ab;
      --line: #2e3238;
      --line-strong: #44494f;
      --pen: #7b9bf2;
      --pen-soft: #22304f;
      --pass: #46c184;
      --pass-soft: #1c3328;
      --fail: #e57866;
      --fail-soft: #3a2521;
      --flag: #e0b24a;
      --flag-soft: #363017;
      --d1: #a68ad4; --d2: #55b9c9; --d3: #e0754a; --d4: #46c184; --d5: #d1a05c;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.25);
    }
  }
  :root[data-theme="dark"] {
    --paper: #17191c;
    --card: #1f2227;
    --ink: #e9ebed;
    --graphite: #9aa2ab;
    --line: #2e3238;
    --line-strong: #44494f;
    --pen: #7b9bf2;
    --pen-soft: #22304f;
    --pass: #46c184;
    --pass-soft: #1c3328;
    --fail: #e57866;
    --fail-soft: #3a2521;
    --flag: #e0b24a;
    --flag-soft: #363017;
    --d1: #a68ad4; --d2: #55b9c9; --d3: #e0754a; --d4: #46c184; --d5: #d1a05c;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16.5px/1.6 var(--body);
    -webkit-font-smoothing: antialiased;
    overflow-x: clip;
  }
  #app { max-width: 820px; margin: 0 auto; padding: 20px 18px 48px; }
  h1, h2 { font-family: var(--display); letter-spacing: -0.01em; }
  h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); font-weight: 800; margin: 0 0 6px; line-height: 1.1; }
  h2 { font-size: 1.05rem; font-weight: 700; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--graphite); }
  p { margin: 6px 0; }
  .muted { color: var(--graphite); font-size: 0.9rem; }
  .mono { font-family: var(--mono); }

  /* title row */
  .title-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 4px 0 2px; flex-wrap: wrap; }
  .title-row h1 { display: flex; align-items: center; gap: 13px; margin: 0; }
  .title-row h1 svg { display: block; flex: none; }
  .controls { display: flex; gap: 8px; align-items: center; }
  .btn.icon { width: 38px; height: 38px; padding: 0; border-radius: 50%; font-size: 1rem; line-height: 1; }
  .signed-chip { font-family: var(--mono); font-size: 0.72rem; color: var(--graphite);
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .signed-chip .dot { color: var(--pass); }

  /* hero */
  .hero { display: flex; gap: 28px; align-items: stretch; justify-content: space-between; margin: 6px 0 26px; flex-wrap: wrap; }
  .hero .intro { flex: 1 1 320px; max-width: 54ch; }
  .hero .rule { height: 3px; background: var(--pen); width: 56px; border-radius: 2px; margin: 10px 0 12px; }
  .hero p { color: var(--graphite); }
  .hero .facts { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-family: var(--mono); font-size: 0.8rem; color: var(--graphite); }
  .hero .facts b { color: var(--ink); font-weight: 700; }
  .hero-cta {
    flex: 0 1 250px; display: flex; flex-direction: column; justify-content: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px; box-shadow: var(--shadow);
  }
  .hero-cta .btn.primary { font-size: 1.02rem; padding: 13px 20px; }
  .hero-cta .sub { font-family: var(--mono); font-size: 0.74rem; color: var(--graphite); text-align: center; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .grid .card { margin: 0; display: flex; flex-direction: column; }
  .grid .card p { flex: 1; color: var(--graphite); font-size: 0.92rem; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .btn {
    font-family: var(--body); font-size: 0.95rem; font-weight: 700;
    padding: 10px 18px;
    border-radius: 10px;
    border: 1.5px solid var(--line-strong);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  .btn:hover:not(:disabled) { border-color: var(--pen); color: var(--pen); }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--pen); border-color: var(--pen); color: #fff; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.1); color: #fff; }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover:not(:disabled) { border-color: var(--line-strong); }
  .btn.small { padding: 6px 12px; font-size: 0.84rem; }
  :is(.btn, .option, .nav-cell, .domain-row, .select):focus-visible {
    outline: 2.5px solid var(--pen); outline-offset: 2px;
  }

  .resume-card { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    border-color: var(--pen); background: var(--pen-soft); }

  .domain-list { display: flex; flex-direction: column; gap: 8px; }
  .domain-row {
    display: flex; gap: 12px; align-items: center; text-align: left;
    font-family: var(--body); font-size: 0.95rem;
    padding: 12px 14px; border-radius: 10px;
    border: 1.5px solid var(--line); background: transparent; color: var(--ink);
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .domain-row:hover { border-color: var(--pen); background: var(--pen-soft); }
  .domain-row .muted { margin-left: auto; text-align: right; font-size: 0.8rem; }
  .domain-chip {
    font-family: var(--mono); font-size: 0.72rem; font-weight: 700; color: #fff;
    padding: 2px 8px; border-radius: 6px; flex: none;
  }
  .chip-d1 { background: var(--d1); } .chip-d2 { background: var(--d2); }
  .chip-d3 { background: var(--d3); } .chip-d4 { background: var(--d4); }
  .chip-d5 { background: var(--d5); }

  .history { width: 100%; border-collapse: collapse; font-size: 0.86rem; margin-bottom: 10px; }
  .history th, .history td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
  .history th { color: var(--graphite); font-weight: 700; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .history td { font-family: var(--mono); font-size: 0.82rem; }
  .history td:first-child { font-family: var(--body); }
  .badge {
    font-family: var(--mono); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em;
    padding: 3px 9px; border-radius: 999px;
  }
  .badge.pass { background: var(--pass-soft); color: var(--pass); }
  .badge.fail { background: var(--fail-soft); color: var(--fail); }
  .badge.big { font-size: 0.85rem; padding: 6px 15px; }

  /* quiz */
  .quiz-header {
    position: sticky; top: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    flex-wrap: wrap;
    margin: 0 -18px 14px; padding: 12px 18px;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .timer {
    font-family: var(--mono); font-weight: 700; font-size: 1rem;
    font-variant-numeric: tabular-nums;
    padding: 5px 13px; border-radius: 9px;
    background: var(--card); border: 1.5px solid var(--line-strong);
  }
  .timer.urgent { color: var(--fail); border-color: var(--fail); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.55; } }
  .tally { display: flex; gap: 6px; }
  .pill {
    font-family: var(--mono); font-size: 0.8rem; font-weight: 700;
    padding: 4px 11px; border-radius: 999px; white-space: nowrap;
  }
  .pill.ok { background: var(--pass-soft); color: var(--pass); }
  .pill.bad { background: var(--fail-soft); color: var(--fail); }
  .btn.exit { color: var(--graphite); }
  .btn.exit:hover:not(:disabled) { border-color: var(--fail); color: var(--fail); background: var(--fail-soft); }

  .progress { height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; margin-bottom: 14px; }
  .progress-fill { height: 100%; border-radius: 999px; background: var(--pen); transition: width 0.3s ease; }

  .navigator {
    display: flex; flex-wrap: nowrap; gap: 5px; margin-bottom: 14px;
    overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin;
  }
  .nav-cell {
    flex: none;
    width: 34px; height: 30px; font-family: var(--mono); font-size: 0.74rem;
    border: 1.5px solid var(--line); border-radius: 7px;
    background: var(--card); color: var(--graphite); cursor: pointer;
  }
  .nav-cell.answered { background: var(--pen-soft); color: var(--pen); border-color: var(--pen); }
  .nav-cell.flagged { background: var(--flag-soft); color: var(--flag); border-color: var(--flag); }
  .nav-cell.current { outline: 2.5px solid var(--pen); outline-offset: 1px; font-weight: 700; }

  .question-card { padding: 26px; max-width: 760px; }
  .q-meta { display: flex; gap: 9px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .q-text { font-size: 1.12rem; font-weight: 700; margin: 0 0 18px; line-height: 1.5; }
  .sub-tag { font-size: 0.78rem; }

  /* scantron options */
  .options { display: flex; flex-direction: column; gap: 10px; counter-reset: opt; }
  .option {
    display: flex; align-items: flex-start; gap: 13px;
    font-family: var(--body); font-size: 0.97rem; line-height: 1.5; text-align: left;
    padding: 13px 15px; border-radius: 11px;
    border: 1.5px solid var(--line); background: transparent; color: var(--ink);
    cursor: pointer; counter-increment: opt;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .opt-letter {
    flex: none; width: 27px; height: 27px; margin-top: -1px;
    border: 2px solid var(--line-strong); border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 0.74rem; font-weight: 700; color: var(--graphite);
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .opt-letter::before { content: counter(opt, upper-alpha); }
  .option:hover:not(:disabled):not(.readonly) { border-color: var(--pen); }
  .option:hover:not(:disabled):not(.readonly) .opt-letter { border-color: var(--pen); color: var(--pen); }
  .option.selected { border-color: var(--pen); background: var(--pen-soft); }
  .option.selected .opt-letter { background: var(--pen); border-color: var(--pen); color: #fff; }
  .option.correct { border-color: var(--pass); background: var(--pass-soft); }
  .option.correct .opt-letter { background: var(--pass); border-color: var(--pass); color: #fff; }
  .option.wrong { border-color: var(--fail); background: var(--fail-soft); }
  .option.wrong .opt-letter { background: var(--fail); border-color: var(--fail); color: #fff; }
  .option.readonly { cursor: default; }
  .option:disabled { cursor: default; color: var(--ink); opacity: 1; }
  .tag { font-family: var(--mono); font-size: 0.68rem; font-weight: 700; color: var(--graphite); margin-left: 6px; text-transform: uppercase; letter-spacing: 0.04em; }

  .feedback { margin-top: 16px; padding: 13px 15px; border-radius: 11px; font-size: 0.93rem; }
  .feedback.ok { background: var(--pass-soft); }
  .feedback.bad { background: var(--fail-soft); }

  .quiz-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; max-width: 760px; }
  .kbd-hint { text-align: center; font-size: 0.74rem; margin-top: 12px; max-width: 760px; }
  kbd {
    font: 700 0.74rem var(--mono);
    background: var(--card); border: 1px solid var(--line-strong); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 6px;
  }

  /* results — the penciled bubble */
  .score-card { display: flex; gap: 28px; align-items: center; padding: 28px; flex-wrap: wrap; }
  .score-card.pass { border-color: var(--pass); }
  .score-card.fail { border-color: var(--fail); }
  .score-ring { position: relative; width: 150px; height: 150px; flex: none; }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring .track { fill: none; stroke: var(--line); stroke-width: 11; }
  .score-ring .fill {
    fill: none; stroke-width: 11; stroke-linecap: round;
    stroke-dasharray: 408; stroke-dashoffset: 408;
    animation: pencil-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .score-ring.pass .fill { stroke: var(--pass); }
  .score-ring.fail .fill { stroke: var(--fail); }
  @keyframes pencil-in { to { stroke-dashoffset: var(--target); } }
  .score-ring .center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .score-ring .num { font-family: var(--mono); font-size: 2rem; font-weight: 700; line-height: 1; }
  .score-ring .den { font-family: var(--mono); font-size: 0.72rem; color: var(--graphite); margin-top: 3px; }
  .score-big { font-family: var(--display); font-size: 3rem; font-weight: 800; line-height: 1; }
  .score-of { font-size: 1.1rem; color: var(--graphite); font-weight: 600; }

  .domain-score { margin-bottom: 13px; }
  .domain-score-label { display: flex; gap: 9px; align-items: center; margin-bottom: 6px; font-size: 0.92rem; }
  .domain-score-label .muted { margin-left: auto; font-family: var(--mono); font-size: 0.78rem; }
  button.domain-score-label.expandable {
    font: inherit; color: inherit; background: none; border: 0; padding: 4px 2px;
    width: 100%; cursor: pointer; text-align: left; border-radius: 7px;
  }
  button.domain-score-label.expandable:hover { background: var(--pen-soft); }
  .chev {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%; flex: none;
    border: 1.5px solid var(--line-strong); color: var(--graphite);
    background: var(--card);
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .chev svg { transition: transform 0.2s ease; }
  .chev.open svg { transform: rotate(180deg); }
  .chev.open { border-color: var(--pen); color: var(--pen); background: var(--pen-soft); }
  button:hover .chev { border-color: var(--pen); color: var(--pen); }
  .sub-scores {
    margin: 11px 0 6px 11px; padding-left: 15px;
    border-left: 2px solid var(--line);
    display: flex; flex-direction: column; gap: 9px;
  }
  .sub-score .sub-label { display: flex; gap: 8px; align-items: baseline; font-size: 0.85rem; margin-bottom: 4px; }
  .sub-code { font-family: var(--mono); font-weight: 700; font-size: 0.72rem; color: var(--graphite); flex: none; }
  .sub-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .sub-label .muted { margin-left: auto; font-family: var(--mono); font-size: 0.72rem; flex: none; }
  .bar.thin { height: 5px; }
  .practice-subs { margin-top: 2px; margin-bottom: 10px; gap: 5px; }
  .sub-row {
    display: flex; gap: 8px; align-items: baseline; text-align: left;
    font: inherit; font-size: 0.88rem; color: var(--ink);
    background: none; border: 0; border-radius: 7px;
    padding: 7px 9px; cursor: pointer; width: 100%;
  }
  .sub-row:hover { background: var(--pen-soft); }
  .sub-row .muted { margin-left: auto; font-family: var(--mono); font-size: 0.72rem; flex: none; }
  .bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1); }
  .bar-fill.ok { background: var(--pass); }
  .bar-fill.bad { background: var(--fail); }
  .actions { margin-top: 6px; }

  .review-card { border-left: 4px solid var(--line); max-width: 760px; }
  .review-card.r-ok { border-left-color: var(--pass); }
  .review-card.r-bad { border-left-color: var(--fail); }

  .select {
    font-family: var(--body); font-size: 0.88rem; padding: 7px 10px;
    border-radius: 9px; border: 1.5px solid var(--line-strong);
    background: var(--card); color: var(--ink);
  }
  .seg { display: inline-flex; border: 1.5px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
  .seg button {
    font-family: var(--mono); font-size: 0.86rem; font-weight: 700;
    padding: 9px 16px; background: var(--card); color: var(--graphite);
    border: 0; border-right: 1.5px solid var(--line); cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .seg button:last-child { border-right: 0; }
  .seg button:hover:not(.active) { color: var(--pen); }
  .seg button.active { background: var(--pen); color: #fff; }
  .seg button:focus-visible { outline: 2.5px solid var(--pen); outline-offset: -2px; }
  .builder-summary { margin: 12px 0 14px; }

  .check-row { cursor: pointer; }
  .check-row input, .check-inline input { accent-color: var(--pen); width: 17px; height: 17px; }
  .check-inline { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .builder-row { justify-content: space-between; }
  .builder-row label { display: flex; gap: 8px; align-items: center; }

  .topbar { display: flex; justify-content: flex-end; margin-bottom: 4px; }
  .input {
    font-family: var(--body); font-size: 0.92rem;
    padding: 9px 12px; border-radius: 9px;
    border: 1.5px solid var(--line-strong);
    background: var(--card); color: var(--ink);
    min-width: 0; flex: 1 1 180px;
  }
  .input:focus-visible { outline: 2.5px solid var(--pen); outline-offset: 1px; }
  .auth-note { font-size: 0.82rem; }

  .load-warning { border-color: var(--flag); background: var(--flag-soft); font-size: 0.92rem; }
  .load-warning a { color: var(--ink); font-weight: 700; }

  .site-footer { margin-top: 34px; text-align: center; font-size: 0.78rem; color: var(--graphite); }
  .site-footer a { color: var(--graphite); }

  code { background: var(--line); padding: 1px 6px; border-radius: 5px; font-family: var(--mono); font-size: 0.84em; }

  @media (max-width: 560px) {
    #app { padding: 18px 12px 70px; }
    .question-card { padding: 18px; }
    .score-card { gap: 18px; padding: 20px; }
    .quiz-header { margin: 0 -12px 12px; padding: 10px 12px; }
    .history { display: block; overflow-x: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .score-ring .fill { stroke-dashoffset: var(--target); }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="questions/domain1.js"></script>
<script src="questions/domain2.js"></script>
<script src="questions/domain3.js"></script>
<script src="questions/domain4.js"></script>
<script src="questions/domain5.js"></script>
<script src="questions/domain1-set2.js"></script>
<script src="questions/domain2-set2.js"></script>
<script src="questions/domain3-set2.js"></script>
<script src="questions/domain4-set2.js"></script>
