<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCAR-F Question Bank</title>
<meta name="description" content="Exam prep for the Claude Certified Architect (Foundations) certification — mock exams, drills, and mastery tracking.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f6f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191c" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f7f4;
    --card: #ffffff;
    --ink: #22262a;
    --graphite: #5a6168;
    --line: #e3e5e0;
    --line-strong: #c9ccc5;
    --pen: #1f4fd8;
    --pen-soft: #e9eefb;
    --pass: #178a50;
    --pass-soft: #e3f2ea;
    --fail: #c8402e;
    --fail-soft: #faeae7;
    --flag: #b07d10;
    --flag-soft: #f9f0da;
    --d1: #6b4fa0; --d2: #0f7a8a; --d3: #b4532a; --d4: #178a50; --d5: #8c5a1f;
    --shadow: 0 1px 2px rgba(34,38,42,0.05), 0 4px 16px rgba(34,38,42,0.06);
    --radius: 14px;
    --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #17191c;
      --card: #1f2227;
      --ink: #e9ebed;
      --graphite: #9aa2ab;
      --line: #2e3238;
      --line-strong: #44494f;
      --pen: #7b9bf2;
      --pen-soft: #22304f;
      --pass: #46c184;
      --pass-soft: #1c3328;
      --fail: #e57866;
      --fail-soft: #3a2521;
      --flag: #e0b24a;
      --flag-soft: #363017;
      --d1: #a68ad4; --d2: #55b9c9; --d3: #e0754a; --d4: #46c184; --d5: #d1a05c;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.25);
    }
  }
  :root[data-theme="dark"] {
    --paper: #17191c;
    --card: #1f2227;
    --ink: #e9ebed;
    --graphite: #9aa2ab;
    --line: #2e3238;
    --line-strong: #44494f;
    --pen: #7b9bf2;
    --pen-soft: #22304f;
    --pass: #46c184;
    --pass-soft: #1c3328;
    --fail: #e57866;
    --fail-soft: #3a2521;
    --flag: #e0b24a;
    --flag-soft: #363017;
    --d1: #a68ad4; --d2: #55b9c9; --d3: #e0754a; --d4: #46c184; --d5: #d1a05c;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16.5px/1.6 var(--body);
    -webkit-font-smoothing: antialiased;
    overflow-x: clip;
  }
  #app { max-width: 820px; margin: 0 auto; padding: 20px 18px 48px; }
  h1, h2 { font-family: var(--display); letter-spacing: -0.01em; }
  h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); font-weight: 800; margin: 0 0 6px; line-height: 1.1; }
  h2 { font-size: 1.05rem; font-weight: 700; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--graphite); }
  p { margin: 6px 0; }
  .muted { color: var(--graphite); font-size: 0.9rem; }
  .mono { font-family: var(--mono); }

  /* title row */
  .title-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 4px 0 2px; flex-wrap: wrap; }
  .title-row h1 { display: flex; align-items: center; gap: 13px; margin: 0; }
  .title-row h1 svg { display: block; flex: none; }
  .controls { display: flex; gap: 8px; align-items: center; min-width: 0; position: relative; }
  /* The account popup anchors to .controls, whose right edge is the page
   * gutter, not to the chip: the theme button sits right of the chip, so a
   * chip-anchored popup ran off the left of a phone screen. */
  .controls > .acct-menu { position: static; min-width: 0; }
  .btn.icon { flex: none; width: 38px; height: 38px; padding: 0; border-radius: 50%; font-size: 1rem; line-height: 1; }
  .signed-chip { font-family: var(--mono); font-size: 0.72rem; color: var(--graphite);
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .signed-chip .dot { color: var(--pass); }
  summary.signed-chip { display: flex; align-items: center; gap: 6px; cursor: pointer; background: var(--card); }
  .signed-chip .chip-email { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .signed-chip > :not(.chip-email) { flex: none; }
  .h-brand { flex: none; }
  summary.signed-chip:hover, .acct-menu[open] > summary.signed-chip { border-color: var(--pen); color: var(--ink); }
  summary.signed-chip:focus-visible { outline: 2.5px solid var(--pen); outline-offset: 2px; }
  .acct-pop {
    position: absolute; z-index: 30; top: calc(100% + 8px); right: 0;
    width: min(400px, calc(100vw - 24px)); max-height: calc(100vh - 90px); overflow-y: auto;
    padding: 18px 20px; background: var(--card); border: 1px solid var(--line-strong);
    border-radius: var(--radius); box-shadow: var(--shadow); text-align: left;
  }
  .acct-pop > .card { border: 0; box-shadow: none; background: none; padding: 0; margin: 0; }
  .acct-pop h2 { margin-top: 0; }
  .acct-admin { margin-top: 12px; }

  /* hero */
  .hero { display: flex; gap: 28px; align-items: stretch; justify-content: space-between; margin: 6px 0 26px; flex-wrap: wrap; }
  .hero .intro { flex: 1 1 320px; max-width: 54ch; }
  .hero .rule { height: 3px; background: var(--pen); width: 56px; border-radius: 2px; margin: 10px 0 12px; }
  .hero p { color: var(--graphite); }
  .hero .facts { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-family: var(--mono); font-size: 0.8rem; color: var(--graphite); }
  .hero .facts b { color: var(--ink); font-weight: 700; }
  .hero-cta {
    flex: 0 1 250px; display: flex; flex-direction: column; justify-content: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px; box-shadow: var(--shadow);
  }
  .hero-cta .btn.primary { font-size: 1.02rem; padding: 13px 20px; }
  .hero-cta .sub { font-family: var(--mono); font-size: 0.74rem; color: var(--graphite); text-align: center; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .grid .card { margin: 0; display: flex; flex-direction: column; }
  .grid .card p { flex: 1; color: var(--graphite); font-size: 0.92rem; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .btn {
    font-family: var(--body); font-size: 0.95rem; font-weight: 700;
    padding: 10px 18px;
    border-radius: 10px;
    border: 1.5px solid var(--line-strong);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  .btn:hover:not(:disabled) { border-color: var(--pen); color: var(--pen); }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  /* Click feedback: the clicked control spins while its screen is built. */
  #app[data-busy], #app[data-busy] [data-action] { cursor: progress; }
  .is-busy::after { content: ""; flex: none; display: inline-block; width: .9em; height: .9em; margin-left: 8px; vertical-align: -2px;
    border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: busy-spin .7s linear infinite; }
  @keyframes busy-spin { to { transform: rotate(360deg); } }
  .h-row.is-busy > :first-child { margin-right: auto; }
  @media (prefers-reduced-motion: reduce) { .is-busy::after { animation-duration: 2.4s; } }
  .btn.primary { background: var(--pen); border-color: var(--pen); color: #fff; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.1); color: #fff; }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover:not(:disabled) { border-color: var(--line-strong); }
  .btn.small { padding: 6px 12px; font-size: 0.84rem; }
  :is(.btn, .option, .nav-cell, .domain-row, .select):focus-visible {
    outline: 2.5px solid var(--pen); outline-offset: 2px;
  }

  .resume-card { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    border-color: var(--pen); background: var(--pen-soft); }

  .domain-list { display: flex; flex-direction: column; gap: 8px; }
  .domain-row {
    display: flex; gap: 12px; align-items: center; text-align: left;
    font-family: var(--body); font-size: 0.95rem;
    padding: 12px 14px; border-radius: 10px;
    border: 1.5px solid var(--line); background: transparent; color: var(--ink);
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .domain-row:hover { border-color: var(--pen); background: var(--pen-soft); }
  .domain-row .muted { margin-left: auto; text-align: right; font-size: 0.8rem; }
  .domain-chip {
    font-family: var(--mono); font-size: 0.72rem; font-weight: 700; color: #fff;
    padding: 2px 8px; border-radius: 6px; flex: none;
  }
  .chip-d1 { background: var(--d1); } .chip-d2 { background: var(--d2); }
  .chip-d3 { background: var(--d3); } .chip-d4 { background: var(--d4); }
  .chip-d5 { background: var(--d5); }

  .table-scroll { overflow-x: auto; margin-bottom: 10px; }
  .history { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 0.86rem; white-space: nowrap; }
  .history th, .history td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
  .history.visitors { min-width: 0; }
  .history th { color: var(--graphite); font-weight: 700; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .history td { font-family: var(--mono); font-size: 0.82rem; }
  .history td:first-child { font-family: var(--body); }
  .badge {
    font-family: var(--mono); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em;
    padding: 3px 9px; border-radius: 999px;
  }
  .badge.pass { background: var(--pass-soft); color: var(--pass); }
  .badge.fail { background: var(--fail-soft); color: var(--fail); }
  .badge.big { font-size: 0.85rem; padding: 6px 15px; }

  /* quiz */
  .quiz-header {
    position: sticky; top: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    flex-wrap: wrap;
    margin: 0 -18px 14px; padding: 12px 18px;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .timer {
    font-family: var(--mono); font-weight: 700; font-size: 1rem;
    font-variant-numeric: tabular-nums;
    padding: 5px 13px; border-radius: 9px;
    background: var(--card); border: 1.5px solid var(--line-strong);
  }
  .timer.urgent { color: var(--fail); border-color: var(--fail); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.55; } }
  .tally { display: flex; gap: 6px; }
  .pill {
    font-family: var(--mono); font-size: 0.8rem; font-weight: 700;
    padding: 4px 11px; border-radius: 999px; white-space: nowrap;
  }
  .pill.ok { background: var(--pass-soft); color: var(--pass); }
  .pill.bad { background: var(--fail-soft); color: var(--fail); }
  .btn.exit { color: var(--graphite); }
  .btn.exit:hover:not(:disabled) { border-color: var(--fail); color: var(--fail); background: var(--fail-soft); }

  .progress { height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; margin-bottom: 14px; }
  .progress-fill { height: 100%; border-radius: 999px; background: var(--pen); transition: width 0.3s ease; }

  .navigator {
    display: flex; flex-wrap: nowrap; gap: 5px; margin-bottom: 14px;
    overflow-x: auto; padding: 4px 4px 8px; scrollbar-width: thin;
  }
  .nav-cell {
    flex: none;
    width: 34px; height: 30px; font-family: var(--mono); font-size: 0.74rem;
    border: 1.5px solid var(--line); border-radius: 7px;
    background: var(--card); color: var(--graphite); cursor: pointer;
  }
  .nav-cell.answered { background: var(--pen-soft); color: var(--pen); border-color: var(--pen); }
  .nav-cell.flagged { background: var(--flag-soft); color: var(--flag); border-color: var(--flag); }
  .nav-cell.current { outline: 2.5px solid var(--pen); outline-offset: 1px; font-weight: 700; }

  .question-card { padding: 26px; max-width: 760px; }
  .q-meta { display: flex; gap: 9px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .q-text { font-size: 1.12rem; font-weight: 700; margin: 0 0 18px; line-height: 1.5; }
  .sub-tag { font-size: 0.78rem; }
  .opt-note {
    margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line);
    font-size: 0.85rem; color: var(--graphite);
  }
  .scenario-tag {
    font-size: 0.72rem; font-weight: 700; color: var(--pen);
    background: var(--pen-soft); border-radius: 6px; padding: 2px 8px;
  }

  /* scantron options */
  .options { display: flex; flex-direction: column; gap: 10px; counter-reset: opt; }
  .option {
    display: flex; align-items: flex-start; gap: 13px;
    font-family: var(--body); font-size: 0.97rem; line-height: 1.5; text-align: left;
    padding: 13px 15px; border-radius: 11px;
    border: 1.5px solid var(--line); background: transparent; color: var(--ink);
    cursor: pointer; counter-increment: opt;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .opt-letter {
    flex: none; width: 27px; height: 27px; margin-top: -1px;
    border: 2px solid var(--line-strong); border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 0.74rem; font-weight: 700; color: var(--graphite);
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .opt-letter::before { content: counter(opt, upper-alpha); }
  .option:hover:not(:disabled):not(.readonly) { border-color: var(--pen); }
  .option:hover:not(:disabled):not(.readonly) .opt-letter { border-color: var(--pen); color: var(--pen); }
  .option.selected { border-color: var(--pen); background: var(--pen-soft); }
  .option.selected .opt-letter { background: var(--pen); border-color: var(--pen); color: #fff; }
  .option.correct { border-color: var(--pass); background: var(--pass-soft); }
  .option.correct .opt-letter { background: var(--pass); border-color: var(--pass); color: #fff; }
  .option.wrong { border-color: var(--fail); background: var(--fail-soft); }
  .option.wrong .opt-letter { background: var(--fail); border-color: var(--fail); color: #fff; }
  .option.readonly { cursor: default; }
  .option:disabled { cursor: default; color: var(--ink); opacity: 1; }
  .tag { font-family: var(--mono); font-size: 0.68rem; font-weight: 700; color: var(--graphite); margin-left: 6px; text-transform: uppercase; letter-spacing: 0.04em; }

  .feedback { margin-top: 16px; padding: 13px 15px; border-radius: 11px; font-size: 0.93rem; }
  .feedback.ok { background: var(--pass-soft); }
  .feedback.bad { background: var(--fail-soft); }

  /* Question screens fill the window: the question grows into the spare
   * height and the action bar sits on the bottom edge, staying in view
   * while a long question or explanation scrolls underneath it. */
  #app:has(.q-screen) { padding-top: 0; padding-bottom: 0; }
  html:has(.q-screen) { scroll-padding: 80px 0 96px; }
  .q-screen { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  .quiz-screen .question-card { flex: 1 0 auto; width: 100%; margin-bottom: 14px; }
  .quiz-footer { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
    position: sticky; bottom: 0; z-index: 10; margin: auto -18px 0;
    /* Right edge lines up with the question card (max 760px) on wide screens. */
    padding: 12px calc(18px + max(0px, 100% - 760px)) calc(12px + env(safe-area-inset-bottom, 0px)) 18px;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--line); }
  .quiz-footer > .row { margin-left: auto; }
  .kbd-hint { flex: 1; text-align: center; font-size: 0.74rem; white-space: nowrap; }
  .scn-mid { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
  .scn-mid .kbd-hint { flex: none; }
  @media (max-width: 680px), (pointer: coarse) { .kbd-hint { display: none; } }
  kbd {
    font: 700 0.74rem var(--mono);
    background: var(--card); border: 1px solid var(--line-strong); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 6px;
  }

  /* results — the penciled bubble */
  .score-card { display: flex; gap: 28px; align-items: center; padding: 28px; flex-wrap: wrap; }
  .score-card.pass { border-color: var(--pass); }
  .score-card.fail { border-color: var(--fail); }
  .score-ring { position: relative; width: 150px; height: 150px; flex: none; }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring .track { fill: none; stroke: var(--line); stroke-width: 11; }
  .score-ring .fill {
    fill: none; stroke-width: 11; stroke-linecap: round;
    stroke-dasharray: 408; stroke-dashoffset: 408;
    animation: pencil-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .score-ring.pass .fill { stroke: var(--pass); }
  .score-ring.fail .fill { stroke: var(--fail); }
  @keyframes pencil-in { to { stroke-dashoffset: var(--target); } }
  .score-ring .center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .score-ring .num { font-family: var(--mono); font-size: 2rem; font-weight: 700; line-height: 1; }
  .score-ring .den { font-family: var(--mono); font-size: 0.72rem; color: var(--graphite); margin-top: 3px; }
  .score-big { font-family: var(--display); font-size: 3rem; font-weight: 800; line-height: 1; }
  .score-of { font-size: 1.1rem; color: var(--graphite); font-weight: 600; }

  .domain-score { margin-bottom: 13px; }
  .domain-score-label { display: flex; gap: 9px; align-items: center; margin-bottom: 6px; font-size: 0.92rem; }
  .domain-score-label .muted { margin-left: auto; font-family: var(--mono); font-size: 0.78rem; }
  button.domain-score-label.expandable {
    font: inherit; color: inherit; background: none; border: 0; padding: 4px 2px;
    width: 100%; cursor: pointer; text-align: left; border-radius: 7px;
  }
  button.domain-score-label.expandable:hover { background: var(--pen-soft); }
  .chev {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%; flex: none;
    border: 1.5px solid var(--line-strong); color: var(--graphite);
    background: var(--card);
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .chev svg { transition: transform 0.2s ease; }
  .chev.open svg, details[open] > summary .chev svg { transform: rotate(180deg); }
  .chev.open, details[open] > summary .chev { border-color: var(--pen); color: var(--pen); background: var(--pen-soft); }
  button:hover .chev, summary:hover .chev { border-color: var(--pen); color: var(--pen); }
  .chev.bare, .chev.bare.open, details[open] > summary .chev.bare { width: 14px; height: 14px; border: 0; background: none; color: inherit; }
  .chev.bare { margin-left: 2px; vertical-align: -2px; }
  .cq-subs-btn { display: inline-flex; align-items: center; gap: 2px; }
  .sub-scores {
    margin: 11px 0 6px 11px; padding-left: 15px;
    border-left: 2px solid var(--line);
    display: flex; flex-direction: column; gap: 9px;
  }
  .sub-score .sub-label { display: flex; gap: 8px; align-items: baseline; font-size: 0.85rem; margin-bottom: 4px; }
  .sub-code { font-family: var(--mono); font-weight: 700; font-size: 0.72rem; color: var(--graphite); flex: none; }
  .sub-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .sub-label .muted { margin-left: auto; font-family: var(--mono); font-size: 0.72rem; flex: none; }
  .bar.thin { height: 5px; }
  .bar { position: relative; }
  .bar-seen {
    position: absolute; inset: 0 auto 0 0; height: 100%;
    background: var(--line-strong); border-radius: 999px;
  }
  .bar-fill { position: relative; z-index: 1; }

  .metric-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .metric {
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; text-align: center;
  }
  .metric-value { font-family: var(--mono); font-size: 1.7rem; font-weight: 700; line-height: 1; }
  .metric-pct { font-size: 0.9rem; color: var(--graphite); }
  .metric-label { font-size: 0.8rem; font-weight: 700; margin-top: 4px; }
  .metric-detail { font-family: var(--mono); font-size: 0.68rem; color: var(--graphite); margin-top: 2px; }
  @media (max-width: 460px) { .metric-row { grid-template-columns: 1fr; } }
  .builder-domain { display: flex; flex-direction: column; }
  .builder-domain .domain-row { gap: 10px; }
  .builder-domain .domain-row .btn { flex: none; margin-left: 4px; }
  .sub-row.check-row { gap: 9px; }
  .sub-row.check-row input { flex: none; }

  .practice-subs { margin-top: 2px; margin-bottom: 10px; gap: 5px; }
  .sub-row {
    display: flex; gap: 8px; align-items: baseline; text-align: left;
    font: inherit; font-size: 0.88rem; color: var(--ink);
    background: none; border: 0; border-radius: 7px;
    padding: 7px 9px; cursor: pointer; width: 100%;
  }
  .sub-row:hover { background: var(--pen-soft); }
  .sub-row .muted { margin-left: auto; font-family: var(--mono); font-size: 0.72rem; flex: none; }
  .bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1); }
  .bar-fill.ok { background: var(--pass); }
  .bar-fill.bad { background: var(--fail); }
  .actions { margin-top: 6px; }

  .review-card { border-left: 4px solid var(--line); max-width: 760px; }
  .review-card.r-ok { border-left-color: var(--pass); }
  .review-card.r-bad { border-left-color: var(--fail); }

  .select {
    font-family: var(--body); font-size: 0.88rem; padding: 7px 10px;
    border-radius: 9px; border: 1.5px solid var(--line-strong);
    background: var(--card); color: var(--ink);
  }
  .seg { display: inline-flex; border: 1.5px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
  .seg button {
    font-family: var(--mono); font-size: 0.86rem; font-weight: 700;
    padding: 9px 16px; background: var(--card); color: var(--graphite);

  }
  .seg button:last-child { border-right: 0; }
  .seg button:hover:not(.active) { color: var(--pen); }
  .seg button.active { background: var(--pen); color: #fff; }
  .seg button:focus-visible { outline: 2.5px solid var(--pen); outline-offset: -2px; }
  .builder-summary { margin: 12px 0 14px; }

  .check-row { cursor: pointer; }
  .check-row input, .check-inline input { accent-color: var(--pen); width: 17px; height: 17px; }
  .check-inline { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .builder-row { justify-content: space-between; }
  .builder-row label { display: flex; gap: 8px; align-items: center; }

  .topbar { display: flex; justify-content: flex-end; margin-bottom: 4px; }
  .input {
    font-family: var(--body); font-size: 0.92rem;
    padding: 9px 12px; border-radius: 9px;
    border: 1.5px solid var(--line-strong);
    background: var(--card); color: var(--ink);

  }
  .input:focus-visible { outline: 2.5px solid var(--pen); outline-offset: 1px; }
  .auth-note { font-size: 0.82rem; }
  .auth-steps { margin-top: 12px; }

  .exam-row { cursor: default; }
  .exam-row:hover { border-color: var(--line); background: transparent; }
  .exam-row .muted { margin-left: auto; }
  .exam-row .btn { flex: none; }

  .all-answered {
    border-color: var(--pen); background: var(--pen-soft);
    font-size: 0.92rem; font-weight: 700; padding: 13px 16px; margin-bottom: 14px;
  }
  .load-warning { border-color: var(--flag); background: var(--flag-soft); font-size: 0.92rem; }
  .load-warning a { color: var(--ink); font-weight: 700; }

  .site-footer { margin-top: 34px; text-align: center; font-size: 0.78rem; color: var(--graphite); }
  .site-footer a { color: var(--graphite); }

  code { background: var(--line); padding: 1px 6px; border-radius: 5px; font-family: var(--mono); font-size: 0.84em; }


  /* scenario exam: scenario fixed on the left, question on the right */
  .scn-screen {
    position: relative; left: 50%; transform: translateX(-50%);
    width: min(1240px, calc(100vw - 32px));
    display: flex; flex-direction: column; gap: 12px;
    padding-top: 12px;
  }
  .scn-body { flex: 1 0 auto; }
  .scn-bottom { margin-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .scn-top, .scn-bottom {
    display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .scn-top { position: sticky; top: 0; z-index: 10; }
  .scn-bottom { position: sticky; bottom: 0; z-index: 10; }
  .btn.flag-on { color: var(--flag); border-color: var(--flag); background: var(--flag-soft); }
  .scn-screen, .scn-body, .scn-question { min-width: 0; }
  .scn-body { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 12px; align-items: stretch; }
  /* The panel fills the column's full height; the scenario text inside it
   * stays pinned while a long question scrolls. */
  .scn-panel {
    padding: 18px 20px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    line-height: 1.6;
  }
  .scn-panel > details { position: sticky; top: 64px; max-height: calc(100vh - 150px); overflow-y: auto; }
  .scn-panel summary { font-family: var(--display); font-weight: 700; font-size: 1.05rem; cursor: pointer; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; list-style: none; }
  .scn-panel summary::-webkit-details-marker { display: none; }
  .scn-text { white-space: pre-line; }
  .scn-question { padding: 22px 24px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  .scn-screen .q-text { font-weight: 500; font-size: 1.04rem; line-height: 1.65; }
  .search-label { display: block; margin-bottom: 8px; }
  .search-input { width: 100%; }
  .search-note { margin: 8px 0 0; font-size: 0.85rem; }
  .search-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .search-head h2 { margin: 0; }
  .search-list { margin: 10px 0 0; padding-left: 22px; }
  .search-list li { margin: 10px 0; line-height: 1.45; }
  .search-list .q-meta { margin-bottom: 2px; }
  .report-link { display: inline-block; margin-top: 10px; font-size: 0.82rem; }
  .pace { font-size: 0.82rem; color: var(--flag); font-weight: 600; }
  .pace:empty { display: none; }
  .pace-list { margin: 4px 0 0; padding-left: 20px; }
  .pace-list li { margin: 2px 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  .opt-row { display: flex; gap: 6px; align-items: stretch; }
  .opt-row > .option { flex: 1; min-width: 0; }
  .strike-btn {
    flex: none; width: 40px; border: 1.5px solid var(--line); border-radius: 11px;
    background: var(--card); color: var(--graphite); font-size: 1.1rem; cursor: pointer;
  }
  /* A mouse strikes by right-click, so the button is hidden there — but it
   * still appears when reached with Tab, so keyboard users can strike too. */
  @media (pointer: fine) {
    .strike-btn:not(:focus-visible) { position: absolute; width: 1px; height: 1px; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); }
  }
  .scn-screen .opt-note { border-top: 0; padding-top: 0; }
  .opt-wrap + .opt-wrap { margin-top: 8px; }
  .scn-question .options { display: flex; flex-direction: column; }
  .option.struck { text-decoration: line-through; opacity: 0.5; }
  .option.struck.selected { opacity: 0.75; }
  .opt-note { margin: 6px 4px 0 44px; font-size: 0.9rem; line-height: 1.5; padding-left: 10px; border-left: 3px solid var(--line-strong); }
  .opt-note.ok { border-left-color: var(--pass); }
  .opt-note.bad { border-left-color: var(--fail); }
  .scn-comment { margin-top: 14px; }
  .scn-hint { font-size: 0.8rem; margin-top: 14px; }
  .scn-review { display: flex; flex-direction: column; gap: 10px; }
  .review-filters { gap: 8px; flex-wrap: wrap; }
  .review-scn { margin: 10px 0 2px; font-size: 1rem; }
  .tiles { display: flex; flex-wrap: wrap; gap: 6px; }
  .tile {
    min-width: 48px; height: 36px; padding: 0 8px; font-family: var(--mono); font-size: 0.8rem;
    border: 1.5px solid var(--line-strong); border-radius: 8px; background: var(--card); color: var(--ink); cursor: pointer;
  }
  .tile.answered { background: var(--pen-soft); color: var(--pen); border-color: var(--pen); }
  .tile.unanswered { border-style: dashed; border-color: var(--fail); }
  .tile.flagged { border-color: var(--flag); box-shadow: inset 0 -3px 0 var(--flag); }
  .obj-row, .scn-row { margin-top: 12px; }
  .scn-review-list { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .scn-review-list .review-card { margin: 0; }
  @media (max-width: 680px) {
    .scn-screen { width: 100%; left: 0; transform: none; }
    .scn-body { grid-template-columns: minmax(0, 1fr); }
    .scn-question { padding: 16px; }
    .scn-top, .scn-bottom { padding: 8px 10px; }
    .scn-panel > details { position: static; max-height: none; }
    .scn-hint { display: none; }
  }


  /* home: readiness-first layout */
  .h-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .h-brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 1.3rem; }
  .h-ready { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; padding: 26px 28px; align-items: center; }
  .h-eyebrow { font-family: var(--body); font-size: .85rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--graphite); margin: 0 0 10px; }
  .h-big { font-family: var(--display); font-size: 3.4rem; font-weight: 800; line-height: 1; }
  .h-big small { font-size: 1.05rem; color: var(--graphite); font-weight: 600; }
  .h-big-sm { font-size: 2.1rem; }
  .h-verdict { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: .85rem; }
  .h-verdict.pass { background: var(--pass-soft); color: var(--pass); }
  .h-verdict.border { background: var(--flag-soft); color: var(--flag); }
  .h-verdict.fail { background: var(--fail-soft); color: var(--fail); }
  .h-meta { color: var(--graphite); margin: 12px 0 0; line-height: 1.6; }
  .h-meta b { color: var(--ink); }
  .h-link { border: 0; background: none; padding: 0; font: inherit; color: var(--pen); text-decoration: underline; cursor: pointer; }
  .h-cta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
  .h-cta-main { font-size: 1.02rem; padding: 12px 22px; }
  .h-menu { position: relative; }
  .h-menu > summary { list-style: none; }
  .h-menu > summary::-webkit-details-marker { display: none; }
  .h-menu-list { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; min-width: 280px; display: flex; flex-direction: column; gap: 2px;
    padding: 6px; background: var(--card); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow); }
  .h-menu-list .btn { display: flex; flex-direction: column; align-items: flex-start; text-align: left; border: 0; }
  .h-menu-list .btn small { font-weight: 400; font-size: .76rem; color: var(--graphite); }
  .h-spark { width: 100%; height: 90px; display: block; }
  .h-spark-cap { display: flex; justify-content: space-between; font-size: .78rem; color: var(--graphite); margin-bottom: 10px; }
  .h-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left; margin-top: 8px;
    padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 11px; background: var(--card); color: var(--ink); font: inherit; cursor: pointer; }
  .h-row:hover:not(:disabled) { border-color: var(--pen); background: var(--pen-soft); }
  .h-row:disabled { opacity: .55; cursor: default; }
  .h-row .muted { font-size: .82rem; white-space: nowrap; }
  .h-due { background: var(--flag-soft); border-color: var(--flag); }
  .h-h2 { font-family: var(--display); font-size: 1.08rem; margin: 0 0 4px; text-transform: none; letter-spacing: 0; }
  .h-gap { margin-top: 18px; }
  .h-sub { color: var(--graphite); font-size: .88rem; margin: 0 0 12px; }
  .h-bank { font-size: .8rem; color: var(--graphite); font-family: var(--mono); margin: 0 0 8px; }
  .h-next { padding: 20px 24px; }
  .h-weak { display: grid; grid-template-columns: 1fr 120px 48px auto; gap: 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .h-weak small { display: block; color: var(--graphite); font-size: .78rem; }
  .h-meter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .h-meter > i { display: block; height: 100%; border-radius: 99px; }
  .h-pct { font-family: var(--mono); font-size: .85rem; text-align: right; }
  /* The grid gap spaces the two cards, so they drop their own bottom margin
   * (stacked on a phone it doubled the gap) and the grid supplies it once. */
  .h-cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: stretch; margin-bottom: 16px; }
  .h-cols > .card { margin-bottom: 0; }
  .h-col { padding: 20px 22px; }
  .h-dom { border-top: 1px solid var(--line); }
  .h-dom-head { display: grid; grid-template-columns: auto 1fr 140px 44px auto; gap: 12px; align-items: center; width: 100%; padding: 10px 0;
    border: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  .h-dom-head small { font-size: .78rem; }
  .h-objs { margin: 0 0 10px 44px; }
  .h-obj { display: grid; grid-template-columns: 1fr 90px 40px auto; gap: 10px; align-items: center; font-size: .86rem; padding: 5px 0; }
  .h-obj .btn { padding: 3px 10px; font-size: .78rem; }
  .h-obj-act { display: flex; gap: 4px; }
  .h-fold { padding: 0; }
  .h-fold > summary { display: flex; align-items: center; gap: 10px; padding: 14px 22px; cursor: pointer; list-style: none; }
  .h-fold > summary .muted { margin-left: auto; }
  .h-fold > summary::-webkit-details-marker { display: none; }
  .h-fold > :not(summary) { margin: 0 22px 16px; }
  .h-fold > .card { margin: 0; border: 0; box-shadow: none; }
  .h-h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--graphite); margin: 14px 0 0; }
  a.h-row { text-decoration: none; }
  .h-res small { display: block; color: var(--graphite); font-size: .8rem; margin-top: 2px; }
  .h-star { color: var(--flag); }
  .h-start { margin-top: 14px; }
  .h-src { font-size: .8rem; margin-left: 6px; }
  .h-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
  .h-step { border: 1.5px dashed var(--line-strong); border-radius: 12px; padding: 12px 14px; font-size: .88rem; color: var(--graphite); }
  .h-step b { display: block; color: var(--ink); margin-bottom: 4px; }
  .h-date { text-align: center; padding: 26px 16px; line-height: 1.8; }
  /* in-app dialogs (js/app/dialog.js) */
  .app-dialog { width: min(440px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line-strong); border-radius: 16px;
    background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .app-dialog::backdrop { background: rgb(10 12 16 / .55); }
  .dlg { padding: 22px 22px 18px; }
  .dlg-title { font-family: var(--display); font-size: 1.15rem; margin: 0 0 8px; }
  .dlg-text { margin: 0 0 4px; color: var(--graphite); line-height: 1.55; }
  .dlg-label { display: block; font-size: .84rem; color: var(--graphite); margin: 12px 0 6px; }
  .dlg-input { width: 100%; box-sizing: border-box; font: inherit; }
  textarea.dlg-input { resize: vertical; min-height: 90px; }
  .dlg-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .btn.danger { background: var(--fail); border-color: var(--fail); color: var(--card); }
  .btn.danger:hover:not(:disabled) { filter: brightness(1.08); color: var(--card); }

  /* header search: a field-like button that opens the search screen */
  .h-top { gap: 12px; }
  .h-search { flex: 0 1 340px; min-width: 0; margin-left: auto; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 8px 0 12px;
    border: 1.5px solid var(--line-strong); border-radius: 999px; background: var(--card); color: var(--graphite); font: inherit; font-size: .9rem; cursor: text; }
  .h-search:hover { border-color: var(--pen); color: var(--ink); }
  .h-search:focus-visible { outline: 2.5px solid var(--pen); outline-offset: 2px; }
  .h-search-text { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .h-search kbd { font-family: var(--mono); font-size: .75rem; padding: 1px 7px; border: 1px solid var(--line-strong); border-radius: 6px; color: var(--graphite); }
  .h-theme { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 999px; font-size: .86rem; }
  .acct-menu > summary { white-space: nowrap; }
  .ico { flex: none; vertical-align: -4px; margin-right: 8px; color: var(--graphite); }
  .h-row:hover .ico { color: var(--pen); }
  .h-empty { margin: 8px 0 0; padding: 10px 14px; border: 1.5px dashed var(--line-strong); border-radius: 11px; color: var(--graphite); font-size: .86rem; }
  @media (max-width: 680px) {
    .h-search { flex: none; width: 38px; height: 38px; padding: 0; justify-content: center; border-radius: 50%; }
    .h-search-text, .h-search kbd, .h-theme-label { display: none; }
    .h-search .ico { margin: 0; }
    .h-theme { width: 38px; padding: 0; justify-content: center; }
    .h-top { gap: 8px; }
    .controls { gap: 6px; }
  }
  @media (max-width: 400px) { .h-brand { font-size: 1.1rem; gap: 8px; } }
  @media (pointer: coarse) { .h-search kbd { display: none; } }

  /* home tabs: a row under the header; a bottom bar on phones */
  .h-tabs { display: flex; gap: 4px; margin: -4px 0 20px; border-bottom: 1px solid var(--line); }
  .h-tab { position: relative; display: flex; align-items: center; gap: 8px; padding: 10px 14px 11px; margin-bottom: -1px;
    border: 0; border-bottom: 2.5px solid transparent; background: none; color: var(--graphite); font: inherit; font-weight: 700; cursor: pointer; }
  .h-tab:hover { color: var(--ink); }
  .h-tab[aria-current="page"] { color: var(--pen); border-bottom-color: var(--pen); }
  .h-tab:focus-visible { outline: 2.5px solid var(--pen); outline-offset: -2px; border-radius: 8px; }
  .h-tab-badge { min-width: 20px; padding: 1px 6px; border-radius: 999px; background: var(--pen); color: var(--card);
    font-size: .72rem; line-height: 1.5; text-align: center; }
  .h-exam span small { display: block; color: var(--graphite); font-size: .8rem; margin-top: 2px; }
  .h-exam-main { border-color: var(--pen); }
  @media (min-width: 900px) { #app:has(.h-page) { max-width: 1120px; } }
  @media (max-width: 680px) {
    #app:has(.h-tabs) { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
    .h-tabs { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; margin: 0; gap: 0;
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px));
      background: var(--card); border-top: 1px solid var(--line-strong); border-bottom: 0; }
    .h-tab { flex-direction: column; gap: 2px; padding: 6px 2px; margin: 0; border-bottom: 0; font-size: .72rem; font-weight: 600; border-radius: 10px; }
    .h-tab[aria-current="page"] { background: var(--pen-soft); }
    .h-tab-badge { position: absolute; top: 2px; left: calc(50% + 6px); font-size: .66rem; min-width: 18px; padding: 0 5px; }
  }
  @media (max-width: 760px) {
    .h-ready, .h-cols, .h-steps { grid-template-columns: 1fr; }
    .h-weak { grid-template-columns: 1fr 48px auto; }
    .h-weak .h-meter, .h-dom-head .h-meter { display: none; }
    .h-dom-head { grid-template-columns: auto 1fr 44px auto; }
    .h-objs { margin-left: 0; }
    .h-big { font-size: 2.8rem; }
    .h-menu-list { min-width: 220px; }
  }
  @media (max-width: 420px) {
    .h-obj { grid-template-columns: 1fr 40px; row-gap: 4px; }
    .h-obj .h-meter { display: none; }
    .h-obj-act { grid-column: 1 / -1; }
  }
  @media (max-width: 560px) {
    #app { padding: 18px 12px 70px; }
    .question-card { padding: 18px; }
    .score-card { gap: 18px; padding: 20px; }
    .quiz-header { margin: 0 -12px 12px; padding: 10px 12px; }
    .quiz-footer { margin: auto -12px 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); }
    .history { font-size: 0.82rem; }
